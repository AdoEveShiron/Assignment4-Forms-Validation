<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Task 4 - Registration Form</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <div class="container mt-5 mb-5" style="max-width: 700px;">
    <h1 class="text-center mb-4">Create an Account</h1>

    <form class="needs-validation" novalidate>

      <div class="row mb-3">
        <div class="col-md-6 mb-3 mb-md-0">
          <label for="firstName" class="form-label">First Name</label>
          <input type="text" class="form-control" id="firstName" required>
          <div class="invalid-feedback">First name is required.</div>
          <div class="valid-feedback">Looks good!</div>
        </div>
        <div class="col-md-6">
          <label for="lastName" class="form-label">Last Name</label>
          <input type="text" class="form-control" id="lastName" required>
          <div class="invalid-feedback">Last name is required.</div>
          <div class="valid-feedback">Looks good!</div>
        </div>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" required>
        <div class="invalid-feedback">Please enter a valid email.</div>
        <div class="valid-feedback">Looks good!</div>
      </div>

      <div class="row mb-3">
        <div class="col-md-6 mb-3 mb-md-0">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" minlength="8" required>
          <div class="invalid-feedback">Password must be at least 8 characters.</div>
          <div class="valid-feedback">Looks good!</div>
        </div>
        <div class="col-md-6">
          <label for="confirmPassword" class="form-label">Confirm Password</label>
          <input type="password" class="form-control" id="confirmPassword" minlength="8" required>
          <div class="invalid-feedback">Passwords must match.</div>
          <div class="valid-feedback">Looks good!</div>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label d-block">Gender</label>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="gender" id="genderMale" value="male" required>
          <label class="form-check-label" for="genderMale">Male</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="gender" id="genderFemale" value="female" required>
          <label class="form-check-label" for="genderFemale">Female</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="gender" id="genderOther" value="other" required>
          <label class="form-check-label" for="genderOther">Other</label>
        </div>
        <div class="invalid-feedback d-block">Please select a gender.</div>
      </div>

      <div class="mb-3">
        <label class="form-label d-block">Hobbies</label>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="checkbox" id="hobbyReading" value="reading">
          <label class="form-check-label" for="hobbyReading">Reading</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="checkbox" id="hobbySports" value="sports">
          <label class="form-check-label" for="hobbySports">Sports</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="checkbox" id="hobbyMusic" value="music">
          <label class="form-check-label" for="hobbyMusic">Music</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="checkbox" id="hobbyGaming" value="gaming">
          <label class="form-check-label" for="hobbyGaming">Gaming</label>
        </div>
      </div>

      <div class="mb-3">
        <label for="country" class="form-label">Country</label>
        <select class="form-select" id="country" required>
          <option value="" selected disabled>Choose your country...</option>
          <option value="kz">Kazakhstan</option>
          <option value="us">United States</option>
          <option value="uk">United Kingdom</option>
          <option value="de">Germany</option>
          <option value="other">Other</option>
        </select>
        <div class="invalid-feedback">Please select a country.</div>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-dark flex-fill">Submit</button>
        <button type="reset" class="btn btn-outline-secondary flex-fill">Reset</button>
      </div>

    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>

</body>
</html>
