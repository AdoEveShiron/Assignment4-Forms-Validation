<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Task 1 - HTML5 Validation</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Contact Us</h1>
  <p class="hint">Try submitting the form empty or with a wrong email to see the browser validation.</p>

  <form>
    <label for="name">Name</label>
    <input type="text" id="name" name="name" required minlength="2" maxlength="50">

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="message">Message</label>
    <textarea id="message" name="message" rows="5" required maxlength="300"></textarea>

    <button type="submit">Submit</button>
  </form>

</body>
</html>
